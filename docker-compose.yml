services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proxima_pagina
    ports:
      - "5432:5432"
    volumes:
      - proxima-pagina-postgres:/var/lib/postgresql/data

volumes:
  proxima-pagina-postgres:
